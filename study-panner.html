<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyFlow | Smart Study Planner</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: #ffffff;
            min-height: 100vh;
            transition: 0.3s;
        }

        body.light {
            background: #f3f6fb;
            color: #111827;
        }

        /* NAVBAR */

        nav {
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 7%;
            background: #11182b;
            border-bottom: 1px solid #26314b;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        body.light nav {
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #7c5cff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-btn {
            border: none;
            background: #202a43;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
        }

        body.light .theme-btn {
            background: #eef2ff;
            color: #111827;
        }

        /* HERO */

        .hero {
            padding: 70px 7% 45px;
            text-align: center;
        }

        .hero h1 {
            font-size: 52px;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #7c5cff;
        }

        .hero p {
            color: #aeb8cc;
            max-width: 650px;
            margin: auto;
            font-size: 17px;
        }

        body.light .hero p {
            color: #667085;
        }

        /* MAIN */

        .container {
            width: 86%;
            max-width: 1200px;
            margin: auto;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #11182b;
            border: 1px solid #26314b;
            border-radius: 15px;
            padding: 25px;
        }

        body.light .stat-card {
            background: white;
            border-color: #e5e7eb;
        }

        .stat-card h3 {
            color: #9ca8bd;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        /* PROGRESS */

        .progress-box {
            background: #11182b;
            border: 1px solid #26314b;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        body.light .progress-box {
            background: white;
            border-color: #e5e7eb;
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .progress-top span:last-child {
            color: #7c5cff;
            font-weight: bold;
        }

        .progress-bar {
            height: 12px;
            background: #252e45;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: #7c5cff;
            border-radius: 20px;
            transition: 0.4s;
        }

        /* APP */

        .app-grid {
            display: grid;
            grid-template-columns: 330px 1fr;
            gap: 25px;
            padding-bottom: 70px;
        }

        .panel {
            background: #11182b;
            border: 1px solid #26314b;
            border-radius: 15px;
            padding: 25px;
        }

        body.light .panel {
            background: white;
            border-color: #e5e7eb;
        }

        .panel h2 {
            margin-bottom: 20px;
        }

        /* FORM */

        label {
            display: block;
            color: #9ca8bd;
            font-size: 14px;
            margin-bottom: 7px;
            margin-top: 15px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #33405c;
            background: #0c1324;
            color: white;
            outline: none;
        }

        body.light input,
        body.light select {
            background: #f8fafc;
            color: #111827;
            border-color: #d0d5dd;
        }

        input:focus,
        select:focus {
            border-color: #7c5cff;
        }

        .add-btn {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #7c5cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* TASK AREA */

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search {
            max-width: 250px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 17px;
            border-radius: 12px;
            background: #182138;
            border: 1px solid #293650;
            transition: 0.3s;
        }

        body.light .task {
            background: #f8fafc;
            border-color: #e5e7eb;
        }

        .task:hover {
            transform: translateX(3px);
        }

        .check {
            width: 23px;
            height: 23px;
            border: 2px solid #7c5cff;
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .task.completed .check {
            background: #7c5cff;
        }

        .task.completed .check::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .task.completed .task-title {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .task-meta {
            color: #8f9bb0;
            font-size: 13px;
        }

        .priority {
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
        }

        .high {
            background: #3b1d2a;
            color: #ff7898;
        }

        .medium {
            background: #3b311c;
            color: #ffc857;
        }

        .low {
            background: #19352c;
            color: #63d6a0;
        }

        .delete-btn {
            border: none;
            background: transparent;
            color: #ff6b81;
            cursor: pointer;
            font-size: 18px;
        }

        .empty {
            text-align: center;
            padding: 45px 20px;
            color: #8f9bb0;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid #26314b;
            color: #8994a8;
        }

        body.light footer {
            border-color: #e5e7eb;
        }

        /* RESPONSIVE */

        @media (max-width: 850px) {

            .app-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .hero h1 {
                font-size: 42px;
            }
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .container {
                width: 90%;
            }

            .hero {
                padding-top: 50px;
            }

            .hero h1 {
                font-size: 35px;
            }

            .hero p {
                font-size: 15px;
            }

            .task-header {
                flex-direction: column;
                align-items: stretch;
            }

            .search {
                max-width: none;
            }

            .task {
                align-items: flex-start;
            }

            .priority {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">
            StudyFlow 📚
        </div>

        <div class="nav-right">

            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">
                🌙
            </button>

        </div>

    </nav>


    <!-- HERO -->

    <header class="hero">

        <h1>
            Plan Smarter. <span>Study Better.</span>
        </h1>

        <p>
            Organize your study tasks, track your progress,
            and stay focused with StudyFlow.
        </p>

    </header>


    <main class="container">


        <!-- STATS -->

        <section class="stats">

            <div class="stat-card">
                <h3>TOTAL TASKS</h3>
                <div class="stat-number" id="totalTasks">0</div>
            </div>

            <div class="stat-card">
                <h3>COMPLETED</h3>
                <div class="stat-number" id="completedTasks">0</div>
            </div>

            <div class="stat-card">
                <h3>REMAINING</h3>
                <div class="stat-number" id="remainingTasks">0</div>
            </div>

        </section>


        <!-- PROGRESS -->

        <section class="progress-box">

            <div class="progress-top">

                <strong>Study Progress</strong>

                <span id="progressText">
                    0%
                </span>

            </div>

            <div class="progress-bar">

                <div
                    class="progress-fill"
                    id="progressFill">
                </div>

            </div>

        </section>


        <!-- APP -->

        <section class="app-grid">


            <!-- ADD TASK -->

            <div class="panel">

                <h2>Add Study Task</h2>

                <form id="taskForm">

                    <label for="taskInput">
                        Task
                    </label>

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="e.g. Learn JavaScript"
                        required
                    >


                    <label for="subjectInput">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="subjectInput"
                        placeholder="e.g. Computer Science"
                        required
                    >


                    <label for="dateInput">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="dateInput"
                    >


                    <label for="priorityInput">
                        Priority
                    </label>

                    <select id="priorityInput">

                        <option value="High">
                            High
                        </option>

                        <option value="Medium" selected>
                            Medium
                        </option>

                        <option value="Low">
                            Low
                        </option>

                    </select>


                    <button
                        type="submit"
                        class="add-btn">
                        + Add Task
                    </button>

                </form>

            </div>


            <!-- TASKS -->

            <div class="panel">

                <div class="task-header">

                    <h2>My Tasks</h2>

                    <input
                        class="search"
                        type="text"
                        id="searchInput"
                        placeholder="Search tasks..."
                    >

                </div>


                <div
                    class="task-list"
                    id="taskList">
                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 StudyFlow — Built with HTML, CSS & JavaScript.
        </p>

    </footer>


    <script>

        /* GET ELEMENTS */

        const taskForm = document.getElementById("taskForm");
        const taskInput = document.getElementById("taskInput");
        const subjectInput = document.getElementById("subjectInput");
        const dateInput = document.getElementById("dateInput");
        const priorityInput = document.getElementById("priorityInput");

        const taskList = document.getElementById("taskList");
        const searchInput = document.getElementById("searchInput");

        const totalTasks = document.getElementById("totalTasks");
        const completedTasks = document.getElementById("completedTasks");
        const remainingTasks = document.getElementById("remainingTasks");

        const progressFill = document.getElementById("progressFill");
        const progressText = document.getElementById("progressText");

        const themeBtn = document.getElementById("themeBtn");


        /* LOAD TASKS */

        let tasks = JSON.parse(
            localStorage.getItem("studyflowTasks")
        ) || [];


        /* SAVE TASKS */

        function saveTasks() {

            localStorage.setItem(
                "studyflowTasks",
                JSON.stringify(tasks)
            );

        }


        /* ADD TASK */

        taskForm.addEventListener("submit", function(event) {

            event.preventDefault();

            const task = {

                id: Date.now(),

                title: taskInput.value.trim(),

                subject: subjectInput.value.trim(),

                date: dateInput.value,

                priority: priorityInput.value,

                completed: false

            };


            tasks.push(task);

            saveTasks();

            taskForm.reset();

            priorityInput.value = "Medium";

            renderTasks();

        });


        /* RENDER TASKS */

        function renderTasks() {

            const searchTerm =
                searchInput.value.toLowerCase().trim();


            const filteredTasks = tasks.filter(function(task) {

                return (
                    task.title.toLowerCase().includes(searchTerm) ||
                    task.subject.toLowerCase().includes(searchTerm)
                );

            });


            taskList.innerHTML = "";


            if (filteredTasks.length === 0) {

                taskList.innerHTML = `
                    <div class="empty">
                        <div style="font-size:40px;">
                            📚
                        </div>

                        <p>
                            No tasks found.
                        </p>

                        <small>
                            Add a study task to get started.
                        </small>
                    </div>
                `;

                updateStats();

                return;

            }


            filteredTasks.forEach(function(task) {

                const taskElement =
                    document.createElement("div");


                taskElement.className =
                    "task" +
                    (task.completed ? " completed" : "");


                const formattedDate =
                    task.date
                    ? new Date(task.date + "T00:00:00")
                        .toLocaleDateString()
                    : "No due date";


                taskElement.innerHTML = `

                    <div
                        class="check"
                        onclick="toggleTask(${task.id})">
                    </div>


                    <div class="task-info">

                        <div class="task-title">
                            ${escapeHTML(task.title)}
                        </div>

                        <div class="task-meta">
                            ${escapeHTML(task.subject)}
                            •
                            ${formattedDate}
                        </div>

                    </div>


                    <span
                        class="priority ${task.priority.toLowerCase()}">
                        ${task.priority}
                    </span>


                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                        title="Delete task">
                        🗑
                    </button>

                `;


                taskList.appendChild(taskElement);

            });


            updateStats();

        }


        /* COMPLETE TASK */

        function toggleTask(id) {

            tasks = tasks.map(function(task) {

                if (task.id === id) {

                    task.completed =
                        !task.completed;

                }

                return task;

            });


            saveTasks();

            renderTasks();

        }


        /* DELETE TASK */

        function deleteTask(id) {

            tasks =
                tasks.filter(function(task) {

                    return task.id !== id;

                });


            saveTasks();

            renderTasks();

        }


        /* UPDATE STATS */

        function updateStats() {

            const total = tasks.length;

            const completed =
                tasks.filter(function(task) {

                    return task.completed;

                }).length;


            const remaining =
                total - completed;


            const progress =
                total === 0
                ? 0
                : Math.round((completed / total) * 100);


            totalTasks.textContent = total;

            completedTasks.textContent = completed;

            remainingTasks.textContent = remaining;

            progressText.textContent =
                progress + "%";

            progressFill.style.width =
                progress + "%";

        }


        /* SEARCH */

        searchInput.addEventListener(
            "input",
            renderTasks
        );


        /* DARK / LIGHT MODE */

        function toggleTheme() {

            document.body.classList.toggle("light");


            const isLight =
                document.body.classList.contains("light");


            themeBtn.textContent =
                isLight ? "☀️" : "🌙";


            localStorage.setItem(
                "studyflowTheme",
                isLight ? "light" : "dark"
            );

        }


        /* LOAD THEME */

        const savedTheme =
            localStorage.getItem("studyflowTheme");


        if (savedTheme === "light") {

            document.body.classList.add("light");

            themeBtn.textContent = "☀️";

        }


        /* SECURITY HELPER */

        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        /* FIRST LOAD */

        renderTasks();

    </script>

</body>
</html>
