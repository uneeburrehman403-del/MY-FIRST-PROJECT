<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WeatherNow | Weather Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    :root {
      --bg: #07111f;
      --card: rgba(255,255,255,0.08);
      --card2: rgba(255,255,255,0.05);
      --text: #ffffff;
      --muted: #aab7c8;
      --primary: #4da3ff;
      --border: rgba(255,255,255,0.1);
    }

    body.light {
      --bg: #eef6ff;
      --card: #ffffff;
      --card2: #f4f8fc;
      --text: #102033;
      --muted: #617084;
      --border: rgba(0,0,0,0.08);
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #164e7a 0%, transparent 35%),
        var(--bg);
      transition: 0.3s;
    }

    header {
      height: 72px;
      padding: 0 7%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
    }

    .logo {
      font-size: 23px;
      font-weight: bold;
    }

    .logo span {
      color: var(--primary);
    }

    .theme-btn {
      border: 0;
      background: var(--card2);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .container {
      width: 88%;
      max-width: 1100px;
      margin: 45px auto;
    }

    .hero {
      text-align: center;
      margin-bottom: 35px;
    }

    .hero h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--muted);
    }

    /* SEARCH */

    .search-box {
      display: flex;
      max-width: 650px;
      margin: 25px auto;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      padding: 15px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 16px;
    }

    .search-box button {
      border: 0;
      background: var(--primary);
      color: white;
      padding: 0 22px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }

    /* WEATHER */

    .weather-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 35px;
      backdrop-filter: blur(15px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.18);
    }

    .location {
      text-align: center;
      margin-bottom: 20px;
    }

    .location h2 {
      font-size: 30px;
    }

    .location p {
      color: var(--muted);
      margin-top: 6px;
    }

    .main-weather {
      text-align: center;
      padding: 20px;
    }

    .weather-icon {
      font-size: 80px;
      margin-bottom: 10px;
    }

    .temperature {
      font-size: 72px;
      font-weight: bold;
    }

    .condition {
      color: var(--muted);
      font-size: 20px;
      margin-top: 5px;
    }

    /* DETAILS */

    .details {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 25px;
    }

    .detail {
      background: var(--card2);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .detail-icon {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .detail h3 {
      margin-bottom: 5px;
    }

    .detail p {
      color: var(--muted);
    }

    .message {
      text-align: center;
      margin-top: 20px;
      color: var(--muted);
      min-height: 22px;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: var(--muted);
    }

    @media (max-width: 700px) {

      .hero h1 {
        font-size: 32px;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        padding: 14px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .weather-card {
        padding: 22px;
      }

      .temperature {
        font-size: 58px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">
      Weather<span>Now</span> 🌤️
    </div>

    <button class="theme-btn" onclick="toggleTheme()">
      🌙 Theme
    </button>
  </header>


  <main class="container">

    <section class="hero">
      <h1>Check the Weather 🌦️</h1>

      <p>
        Search any city and explore its weather conditions.
      </p>

      <div class="search-box">

        <input
          type="text"
          id="cityInput"
          placeholder="Enter city name..."
          onkeydown="handleEnter(event)"
        >

        <button onclick="searchWeather()">
          Search
        </button>

      </div>
    </section>


    <section class="weather-card">

      <div class="location">

        <h2 id="cityName">
          Karachi, Pakistan
        </h2>

        <p id="date">
          Weather Dashboard
        </p>

      </div>


      <div class="main-weather">

        <div class="weather-icon" id="weatherIcon">
          ☀️
        </div>

        <div class="temperature" id="temperature">
          28°C
        </div>

        <div class="condition" id="condition">
          Sunny
        </div>

      </div>


      <div class="details">

        <div class="detail">

          <div class="detail-icon">
            💧
          </div>

          <h3 id="humidity">
            65%
          </h3>

          <p>
            Humidity
          </p>

        </div>


        <div class="detail">

          <div class="detail-icon">
            💨
          </div>

          <h3 id="wind">
            14 km/h
          </h3>

          <p>
            Wind Speed
          </p>

        </div>


        <div class="detail">

          <div class="detail-icon">
            🌡️
          </div>

          <h3 id="feels">
            30°C
          </h3>

          <p>
            Feels Like
          </p>

        </div>

      </div>

      <div class="message" id="message"></div>

    </section>

  </main>


  <footer>
    WeatherNow © 2026 • Built with HTML, CSS & JavaScript
  </footer>


  <script>

    /*
      DEMO WEATHER DATA

      This version uses sample data so the project
      works immediately without an API key.

      Later you can connect a real weather API.
    */

    const weatherData = {

      karachi: {
        city: "Karachi, Pakistan",
        temp: 28,
        condition: "Sunny",
        icon: "☀️",
        humidity: 65,
        wind: 14,
        feels: 30
      },

      lahore: {
        city: "Lahore, Pakistan",
        temp: 26,
        condition: "Partly Cloudy",
        icon: "⛅",
        humidity: 58,
        wind: 11,
        feels: 27
      },

      islamabad: {
        city: "Islamabad, Pakistan",
        temp: 23,
        condition: "Cloudy",
        icon: "☁️",
        humidity: 61,
        wind: 9,
        feels: 24
      },

      london: {
        city: "London, United Kingdom",
        temp: 16,
        condition: "Cloudy",
        icon: "☁️",
        humidity: 72,
        wind: 18,
        feels: 15
      },

      dubai: {
        city: "Dubai, UAE",
        temp: 34,
        condition: "Sunny",
        icon: "☀️",
        humidity: 48,
        wind: 13,
        feels: 37
      },

      newyork: {
        city: "New York, USA",
        temp: 21,
        condition: "Clear",
        icon: "🌤️",
        humidity: 55,
        wind: 15,
        feels: 22
      }

    };


    function searchWeather() {

      const input =
        document.getElementById("cityInput");

      const city =
        input.value.trim().toLowerCase();

      const message =
        document.getElementById("message");


      if (city === "") {

        message.textContent =
          "Please enter a city name.";

        return;
      }


      /*
        Remove spaces so "New York"
        becomes "newyork".
      */

      const key =
        city.replace(/\s+/g, "");


      if (!weatherData[key]) {

        message.textContent =
          "Demo data not available for this city. Try Karachi, Lahore, Islamabad, London, Dubai or New York.";

        return;
      }


      const data =
        weatherData[key];


      document.getElementById("cityName").textContent =
        data.city;

      document.getElementById("temperature").textContent =
        data.temp + "°C";

      document.getElementById("condition").textContent =
        data.condition;

      document.getElementById("weatherIcon").textContent =
        data.icon;

      document.getElementById("humidity").textContent =
        data.humidity + "%";

      document.getElementById("wind").textContent =
        data.wind + " km/h";

      document.getElementById("feels").textContent =
        data.feels + "°C";


      message.textContent =
        "Weather information loaded successfully.";

    }


    function handleEnter(event) {

      if (event.key === "Enter") {
        searchWeather();
      }

    }


    /* THEME */

    function toggleTheme() {

      document.body.classList.toggle("light");

      const light =
        document.body.classList.contains("light");

      localStorage.setItem(
        "weatherTheme",
        light ? "light" : "dark"
      );

    }


    const savedTheme =
      localStorage.getItem("weatherTheme");

    if (savedTheme === "light") {

      document.body.classList.add("light");

    }


    /* DATE */

    const today =
      new Date();

    document.getElementById("date").textContent =
      today.toLocaleDateString(
        "en-US",
        {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric"
        }
      );

  </script>

</body>
</html>
